name: Jalankan Scraper Blibli

on:
  schedule:
    # Gunakan cron untuk menjadwalkan workflow. Formatnya adalah "menit jam hari-bulan bulan hari-minggu"
    - cron: '0 */6 * * *' # Jalan setiap 6 jam sekali
  workflow_dispatch: # Memunculkan tombol "Run workflow" agar bisa dites manual

jobs:
  scrape-data:
    runs-on: ubuntu-latest # Server gratis dari GitHub yang sudah ada Chrome-nya

    steps:
      - name: Ambil kode dari repository
        uses: actions/checkout@v3

      - name: Siapkan Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' # Versi Python yang digunakan

      - name: Upgrade pip dan Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Jalankan script scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scrape_blibli.py